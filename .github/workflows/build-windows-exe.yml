name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Test driving-date handling
        run: python -m unittest -v test_dates

      - name: Build EXE
        run: pyinstaller --onefile --name "GLS Rapportgenerator" app.py

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force
          Copy-Item "dist/GLS Rapportgenerator.exe" "package/GLS Rapportgenerator.exe"
          Copy-Item "README.md" "package/README.md"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: GLS-Rapportgenerator-Windows
          path: package/

      - name: Determine release version
        id: release_version
        shell: pwsh
        run: |
          $match = Select-String -Path app.py -Pattern '^VERSION\s*=\s*"([^"]+)"'
          if (-not $match) { throw 'VERSION not found in app.py' }
          $tag = $match.Matches[0].Groups[1].Value
          if (-not $tag.StartsWith('v')) { $tag = 'v' + $tag }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create Windows download ZIP
        shell: pwsh
        run: Compress-Archive -Path "package/*" -DestinationPath "GLS-Rapportgenerator-Windows.zip" -Force

      - name: Publish Windows EXE to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          name: GLS Rapportgenerator ${{ steps.release_version.outputs.tag }}
          body: |
            Windows-version af GLS Rapportgenerator.
            Hent GLS-Rapportgenerator-Windows.zip under Assets, pak filen ud og åbn GLS Rapportgenerator.exe.
            Python er ikke nødvendigt.
          files: GLS-Rapportgenerator-Windows.zip
          fail_on_unmatched_files: true
