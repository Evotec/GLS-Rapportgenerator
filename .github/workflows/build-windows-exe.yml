name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --name "GLS Rapportgenerator" app.py

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force
          Copy-Item "dist/GLS Rapportgenerator.exe" "package/GLS Rapportgenerator.exe"
          Copy-Item "README.md" "package/README.md"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: GLS-Rapportgenerator-Windows
          path: package/
